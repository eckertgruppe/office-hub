<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Office Hub</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">◆</span>
    <span>Office Hub</span>
  </div>
  <nav class="tabs">
    <button class="tab active" data-view="dashboard">Dashboard</button>
    <button class="tab" data-view="items">Tickets & Termine</button>
    <button class="tab" data-view="calendar">Kalender</button>
    <button class="tab" data-view="recurring">Wiederkehrend</button>
    <button class="tab" data-view="employees">Mitarbeiter</button>
  </nav>
  <button class="btn-primary" id="newItemBtn">+ Neu</button>
</header>

<main>
  <section id="view-dashboard" class="view active">
    <div class="toolbar">
      <h1>Übersicht</h1>
      <button class="btn-primary" id="runRemindersBtn" style="background:var(--primary);color:white;">📱 Jetzt erinnern</button>
    </div>
    <div class="stats-grid">
      <div class="stat-card stat-offen"><div class="stat-num" id="stat-offen">0</div><div class="stat-label">Offen</div></div>
      <div class="stat-card stat-arbeit"><div class="stat-num" id="stat-arbeit">0</div><div class="stat-label">In Arbeit</div></div>
      <div class="stat-card stat-erledigt"><div class="stat-num" id="stat-erledigt">0</div><div class="stat-label">Erledigt</div></div>
      <div class="stat-card stat-ueberfaellig"><div class="stat-num" id="stat-ueberfaellig">0</div><div class="stat-label">Überfällig</div></div>
    </div>
    <h2>Anstehend</h2>
    <div id="upcoming-list" class="item-list"></div>
  </section>

  <section id="view-items" class="view">
    <div class="toolbar">
      <h1>Tickets & Termine</h1>
      <div class="filters">
        <select id="filter-status">
          <option value="">Alle Status</option>
          <option value="offen">Offen</option>
          <option value="in_arbeit">In Arbeit</option>
          <option value="erledigt">Erledigt</option>
        </select>
        <select id="filter-type">
          <option value="">Alle Typen</option>
          <option value="ticket">Ticket</option>
          <option value="termin">Termin</option>
        </select>
        <select id="filter-assignee">
          <option value="">Alle Personen</option>
        </select>
      </div>
    </div>
    <div id="items-list" class="item-list"></div>
  </section>

  <section id="view-calendar" class="view">
    <div class="toolbar">
      <h1 id="cal-title">Kalender</h1>
      <div style="display:flex;gap:8px;">
        <button class="btn-ghost" id="cal-prev">◀</button>
        <button class="btn-ghost" id="cal-today">Heute</button>
        <button class="btn-ghost" id="cal-next">▶</button>
      </div>
    </div>
    <div id="calendar"></div>
  </section>

  <section id="view-recurring" class="view">
    <div class="toolbar">
      <h1>Wiederkehrende Termine</h1>
      <button class="btn-primary" id="newRecurringBtn" style="background:var(--primary);color:white;">+ Neu</button>
    </div>
    <div id="recurring-list" class="item-list"></div>
  </section>

  <section id="view-employees" class="view">
    <div class="toolbar">
      <h1>Mitarbeiter</h1>
      <button class="btn-primary" id="newEmployeeBtn" style="background:var(--primary);color:white;">+ Mitarbeiter</button>
    </div>
    <div id="employees-list" class="employee-grid"></div>
  </section>
</main>

<!-- Modal: Item -->
<div class="modal" id="itemModal">
  <div class="modal-content" style="max-width:640px;">
    <h2 id="itemModalTitle">Neues Ticket / Termin</h2>
    <form id="itemForm">
      <input type="hidden" id="item-id" />
      <div class="row">
        <label>Typ
          <select id="item-type" required>
            <option value="ticket">🎫 Ticket</option>
            <option value="termin">📅 Termin</option>
          </select>
        </label>
        <label>Status
          <select id="item-status">
            <option value="offen">Offen</option>
            <option value="in_arbeit">In Arbeit</option>
            <option value="erledigt">Erledigt</option>
          </select>
        </label>
      </div>
      <label>Titel
        <input type="text" id="item-title" required maxlength="200" />
      </label>
      <label>Beschreibung
        <textarea id="item-description" rows="4"></textarea>
      </label>
      <div class="row">
        <label>Priorität
          <select id="item-priority">
            <option value="niedrig">Niedrig</option>
            <option value="mittel" selected>Mittel</option>
            <option value="hoch">Hoch</option>
          </select>
        </label>
        <label>Zuständige Person
          <select id="item-assignee">
            <option value="">— nicht zugewiesen —</option>
          </select>
        </label>
      </div>
      <div class="row">
        <label>Fälligkeit
          <input type="datetime-local" id="item-due" />
        </label>
        <label>Erstellt von
          <input type="text" id="item-createdby" placeholder="Dein Name" />
        </label>
      </div>

      <div id="itemExtras" style="display:none;border-top:1px solid var(--border);padding-top:16px;margin-top:8px;">
        <h3 style="font-size:15px;margin-bottom:12px;color:var(--text-soft);">📎 Anhänge</h3>
        <div id="attachments-list" style="margin-bottom:8px;"></div>
        <input type="file" id="attach-file" style="font-size:13px;" />

        <h3 style="font-size:15px;margin:20px 0 12px;color:var(--text-soft);">💬 Kommentare</h3>
        <div id="comments-list" style="max-height:220px;overflow-y:auto;margin-bottom:12px;"></div>
        <div style="display:flex;gap:8px;">
          <input type="text" id="comment-author" placeholder="Dein Name" style="flex:0 0 30%;" />
          <input type="text" id="comment-text" placeholder="Kommentar schreiben..." style="flex:1;" />
          <button type="button" class="btn-primary" id="addCommentBtn" style="background:var(--primary);color:white;">Senden</button>
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn-danger" id="deleteItemBtn" style="display:none">Löschen</button>
        <button type="button" class="btn-ghost" id="cancelItemBtn">Abbrechen</button>
        <button type="submit" class="btn-primary" style="background:var(--primary);color:white;">Speichern</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal: Employee -->
<div class="modal" id="employeeModal">
  <div class="modal-content">
    <h2 id="employeeModalTitle">Neuer Mitarbeiter</h2>
    <form id="employeeForm">
      <input type="hidden" id="emp-id" />
      <label>Name
        <input type="text" id="emp-name" required />
      </label>
      <label>Outlook-E-Mail
        <input type="email" id="emp-email" />
      </label>
      <label>WhatsApp-Nummer (mit Ländervorwahl)
        <input type="tel" id="emp-phone" placeholder="+491721234567" />
      </label>
      <label>Telegram Chat-ID
        <input type="text" id="emp-tgid" placeholder="wird automatisch gefüllt" />
        <small style="text-transform:none;letter-spacing:normal;font-weight:400;color:var(--text-soft);display:block;margin-top:4px;">
          Mitarbeiter sucht Bot in Telegram und sendet <b>/start</b> — dann wird die Chat-ID automatisch verknüpft (Name muss übereinstimmen).
        </small>
      </label>
      <label>CallMeBot API-Key (optional)
        <input type="text" id="emp-wakey" placeholder="leer bei Telegram" />
      </label>
      <div class="modal-actions">
        <button type="button" class="btn-danger" id="deleteEmpBtn" style="display:none">Entfernen</button>
        <button type="button" class="btn-ghost" id="testTelegramBtn" style="display:none">✈️ Telegram Test</button>
        <button type="button" class="btn-ghost" id="testWhatsAppBtn" style="display:none">📱 WhatsApp Test</button>
        <button type="button" class="btn-ghost" id="cancelEmpBtn">Abbrechen</button>
        <button type="submit" class="btn-primary" style="background:var(--primary);color:white;">Speichern</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal: Recurring -->
<div class="modal" id="recurringModal">
  <div class="modal-content">
    <h2 id="recModalTitle">Wiederkehrender Termin</h2>
    <form id="recurringForm">
      <input type="hidden" id="rec-id" />
      <div class="row">
        <label>Typ
          <select id="rec-type" required>
            <option value="ticket">🎫 Ticket</option>
            <option value="termin">📅 Termin</option>
          </select>
        </label>
        <label>Priorität
          <select id="rec-priority">
            <option value="niedrig">Niedrig</option>
            <option value="mittel" selected>Mittel</option>
            <option value="hoch">Hoch</option>
          </select>
        </label>
      </div>
      <label>Titel
        <input type="text" id="rec-title" required />
      </label>
      <label>Beschreibung
        <textarea id="rec-description" rows="3"></textarea>
      </label>
      <label>Zuständige Person
        <select id="rec-assignee"></select>
      </label>
      <div class="row">
        <label>Wiederholung
          <select id="rec-kind">
            <option value="daily">Täglich</option>
            <option value="weekly">Wöchentlich</option>
            <option value="monthly">Monatlich</option>
          </select>
        </label>
        <label>Uhrzeit
          <input type="time" id="rec-time" value="08:00" />
        </label>
      </div>
      <div class="row" id="rec-weekday-row" style="display:none;">
        <label>Wochentag
          <select id="rec-weekday">
            <option value="1">Montag</option>
            <option value="2">Dienstag</option>
            <option value="3">Mittwoch</option>
            <option value="4">Donnerstag</option>
            <option value="5">Freitag</option>
            <option value="6">Samstag</option>
            <option value="0">Sonntag</option>
          </select>
        </label>
        <div></div>
      </div>
      <div class="row" id="rec-day-row" style="display:none;">
        <label>Tag im Monat
          <input type="number" id="rec-day" min="1" max="28" value="1" />
        </label>
        <div></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-danger" id="deleteRecBtn" style="display:none">Löschen</button>
        <button type="button" class="btn-ghost" id="cancelRecBtn">Abbrechen</button>
        <button type="submit" class="btn-primary" style="background:var(--primary);color:white;">Speichern</button>
      </div>
    </form>
  </div>
</div>

<script src="app.js?v=2"></script>
</body>
</html>
